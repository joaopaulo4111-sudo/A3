<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="blackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181f" />
      <stop offset="100%" stop-color="#0a0a0d" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae69e" />
      <stop offset="45%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#997b1e" />
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="50%" stop-color="#fff1c5" />
      <stop offset="100%" stop-color="#b8860b" />
    </linearGradient>
  </defs>

  <!-- Deep Obsidian Shield / Base -->
  <rect x="2" y="2" width="44" height="44" rx="10" fill="url(#blackGrad)" stroke="url(#goldGrad)" stroke-width="1.8" />

  <!-- Magnata Crown Emblem on Top -->
  <path d="M17 14 L20 17 L24 13 L28 17 L31 14 L30 20 L18 20 Z" fill="url(#goldGrad)" />
  <circle cx="17" cy="13" r="1" fill="#fff1c5" />
  <circle cx="24" cy="12" r="1.3" fill="#fff1c5" />
  <circle cx="31" cy="13" r="1" fill="#fff1c5" />

  <!-- Aerodynamic Luxury Car Silhouette -->
  <path d="M10 29 L14 22 C15 20.5 17 19.5 20 19.5 L28 19.5 C31 19.5 33 20.5 34 22 L38 29 Z" fill="none" stroke="url(#goldLight)" stroke-width="2.2" stroke-linejoin="round" />
  <path d="M14 22 L34 22" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" />

  <!-- Glass / Cabin Curve -->
  <path d="M17 22 L22 17.5 C23 16.8 25 16.8 26 17.5 L31 22 Z" fill="url(#goldGrad)" opacity="0.25" />

  <!-- Luxury Spoke Wheels with Gold Rims -->
  <circle cx="15.5" cy="30" r="4.2" fill="#0c0c0e" stroke="url(#goldLight)" stroke-width="1.8" />
  <circle cx="15.5" cy="30" r="1.6" fill="url(#goldGrad)" />
  <circle cx="32.5" cy="30" r="4.2" fill="#0c0c0e" stroke="url(#goldLight)" stroke-width="1.8" />
  <circle cx="32.5" cy="30" r="1.6" fill="url(#goldGrad)" />

  <!-- Prestige Golden Baseline -->
  <line x1="8" y1="36.5" x2="40" y2="36.5" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" />
  <line x1="14" y1="39" x2="34" y2="39" stroke="url(#goldGrad)" stroke-width="1" stroke-linecap="round" opacity="0.6" />
</svg>
